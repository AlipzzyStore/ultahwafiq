<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wafiq 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffc0cb 0%, #ffb6d9 50%, #ffa5c8 100%);
            min-height: 100vh;
            position: relative;
        }

        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutLoading 0.8s ease-out 2.5s forwards;
        }

        .loading-content {
            text-align: center;
        }

        .birthday-cake {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.8s ease-in-out infinite;
        }

        .loading-text {
            font-size: 28px;
            color: white;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 30px;
            animation: fadeInText 1s ease-in;
        }

        .loading-text span {
            display: inline-block;
            animation: jumpText 0.6s ease-in-out infinite;
        }

        .loading-text span:nth-child(1) { animation-delay: 0s; }
        .loading-text span:nth-child(2) { animation-delay: 0.1s; }
        .loading-text span:nth-child(3) { animation-delay: 0.2s; }
        .loading-text span:nth-child(4) { animation-delay: 0.3s; }
        .loading-text span:nth-child(5) { animation-delay: 0.4s; }

        .loader {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .loader-dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .loader-dot:nth-child(1) { animation-delay: 0s; }
        .loader-dot:nth-child(2) { animation-delay: 0.2s; }
        .loader-dot:nth-child(3) { animation-delay: 0.4s; }

        /* ===== ANIMATIONS ===== */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes jumpText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInText {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeOutLoading {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 20, 147, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 20, 147, 0.8); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: slideUp 0.8s ease-out 2.5s forwards;
            padding: 20px;
            position: relative;
        }

        /* ===== FLOATING ELEMENTS ===== */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.3;
            animation: floatHeart 6s ease-in infinite;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) translateX(50px);
                opacity: 0;
            }
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .title-section {
            text-align: center;
            animation: slideUp 0.8s ease-out 2.7s forwards;
            opacity: 0;
        }

        .title {
            font-size: clamp(28px, 8vw, 48px);
            color: white;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: clamp(16px, 5vw, 24px);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            animation: slideUp 0.8s ease-out 2.9s forwards, glow 2s ease-in-out 3s infinite;
            opacity: 0;
            border: 2px solid rgba(255, 105, 180, 0.2);
            text-align: center;
        }

        .message-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(255, 20, 147, 0.25);
        }

        .card-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        .card-text {
            font-size: clamp(16px, 4vw, 22px);
            color: #ff1493;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-subtext {
            font-size: clamp(12px, 3vw, 16px);
            color: #666;
            font-weight: 400;
        }

        /* ===== LETTER SECTION ===== */
        .letter-section {
            display: none;
            width: 100%;
            max-width: 600px;
            animation: slideUp 0.6s ease-out forwards;
        }

        .letter-section.show {
            display: block;
        }

        .letter-header {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            animation: slideUp 0.6s ease-out;
        }

        .letter-content {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px 30px;
            border-radius: 0 0 20px 20px;
            line-height: 1.8;
            color: #333;
            font-size: clamp(14px, 3vw, 18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-height: 300px;
            overflow-y: auto;
            animation: slideUp 0.6s ease-out 0.2s forwards;
            opacity: 0;
        }

        .letter-content::-webkit-scrollbar {
            width: 8px;
        }

        .letter-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .letter-content::-webkit-scrollbar-thumb {
            background: #ff1493;
            border-radius: 10px;
        }

        .letter-content::-webkit-scrollbar-thumb:hover {
            background: #ff69b4;
        }

        .letter-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Arial', sans-serif;
        }

        /* ===== PHOTO GALLERY ===== */
        .photo-section {
            display: none;
            width: 100%;
            max-width: 100%;
            margin-top: 40px;
            padding-bottom: 50px;
            animation: slideUp 0.6s ease-out forwards;
        }

        .photo-section.show {
            display: block;
        }

        .photo-title {
            color: white;
            font-size: clamp(20px, 6vw, 32px);
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 0 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .photo-gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                padding: 0 20px;
            }
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            aspect-ratio: 1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.6s ease-out backwards;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-item:nth-child(1) { animation-delay: 0.1s; }
        .photo-item:nth-child(2) { animation-delay: 0.2s; }
        .photo-item:nth-child(3) { animation-delay: 0.3s; }
        .photo-item:nth-child(4) { animation-delay: 0.4s; }
        .photo-item:nth-child(5) { animation-delay: 0.5s; }
        .photo-item:nth-child(6) { animation-delay: 0.6s; }
        .photo-item:nth-child(7) { animation-delay: 0.7s; }

        .photo-item:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.3);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(60%) brightness(1.1);
            transition: filter 0.3s ease;
        }

        .photo-item:hover img {
            filter: grayscale(40%) brightness(1.15);
        }

        .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.3), rgba(255, 20, 147, 0.3));
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        /* ===== AUDIO PLAYER ===== */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .music-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.6);
        }

        .music-btn.playing {
            animation: rotate 2s linear infinite;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .message-card {
                padding: 30px 20px;
            }

            .letter-content {
                padding: 25px 20px;
                font-size: 16px;
            }

            .title {
                font-size: 36px;
            }

            .photo-gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .music-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
                bottom: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .message-card {
                padding: 25px 20px;
            }

            .letter-content {
                padding: 20px 15px;
                font-size: 15px;
                max-height: 250px;
            }

            .title {
                font-size: 28px;
            }

            .photo-gallery {
                grid-template-columns: 1fr;
            }

            .music-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            color: #ff1493;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: none;
            z-index: 50;
        }

        .back-btn.show {
            display: block;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.2);
        }

        @media (max-width: 480px) {
            .back-btn {
                padding: 10px 15px;
                font-size: 14px;
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-content">
            <div class="birthday-cake">🎂</div>
            <div class="loading-text">
                <span>H</span>
                <span>a</span>
                <span>p</span>
                <span>p</span>
                <span>y</span>
            </div>
            <div class="loader">
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
            </div>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- Main Container -->
    <div class="container">
        <button class="back-btn" id="backBtn">← Back</button>

        <!-- Title Section -->
        <div class="title-section">
            <h1 class="title">Happy Birthday 🎉</h1>
            <p class="subtitle">Wafiq 15 Tahun</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Message Card -->
            <div class="message-card" id="messageCard">
                <div class="card-icon">💌</div>
                <div class="card-text">Klik aku dong!</div>
                <div class="card-subtext">Ada sesuatu yang spesial untuk kamu</div>
            </div>

            <!-- Letter Section -->
            <div class="letter-section" id="letterSection">
                <div class="letter-header">💕 Surat Spesial 💕</div>
                <div class="letter-content">
                    <div class="letter-text" id="letterText"></div>
                </div>
            </div>

            <!-- Photo Section -->
            <div class="photo-section" id="photoSection">
                <h2 class="photo-title">✨ Our Memories ✨</h2>
                <div class="photo-gallery" id="photoGallery"></div>
            </div>
        </div>
    </div>

    <!-- Music Player -->
    <div class="music-player">
        <button class="music-btn" id="musicBtn">🎵</button>
        <audio id="bgMusic" src="https://files.catbox.moe/ge74cf.mp4"></audio>
    </div>

    <script>
        // ===== MESSAGE =====
        const message = `haaaii sayaanngggkuu, happy birthdayyyy yaaaaa cannntiikkkk ciiee udaahhh umuuuurr 15 tahuunnn. Semoga kamuuu diberii kesehatan panjang umuurrr, jangan sering maraaahh maraahh cilll. Aku juggaa mintaa maafff yaaa klooo adaaa salaahh ke kaammuu btw akuuu seneengg harii iniii kamuuu ulang tahuunnn :> mogga rezeki nya ngalirr yaaa sayangg dan terutam semogaa kitaaaa bisa bersama sama teruss kalo bisa sampe mati, maaff yaa kalo design website nya jeellekk mwehehehe barruu belajarrr, uddahhh segiituu ajaa ucaapan darii akuu. Lovee youuuu saayyannggggggggggg`;

        // ===== PHOTOS =====
        const photos = [
            "https://files.catbox.moe/xsmffd.jpg",
            "https://files.catbox.moe/bh4fek.jpg",
            "https://files.catbox.moe/kp88od.jpg",
            "https://files.catbox.moe/l4bqo1.jpg",
            "https://files.catbox.moe/t72vql.jpg",
            "https://files.catbox.moe/cxzmrs.jpg",
            "https://files.catbox.moe/dbr0l2.jpg"
        ];

        // ===== DOM ELEMENTS =====
        const messageCard = document.getElementById('messageCard');
        const letterSection = document.getElementById('letterSection');
        const photoSection = document.getElementById('photoSection');
        const letterText = document.getElementById('letterText');
        const photoGallery = document.getElementById('photoGallery');
        const backBtn = document.getElementById('backBtn');
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        const floatingHearts = document.getElementById('floatingHearts');

        // ===== FLOATING HEARTS =====
        function createFloatingHearts() {
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (4 + Math.random() * 4) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                floatingHearts.appendChild(heart);
            }
        }

        // ===== LOAD PHOTOS =====
        function loadPhotos() {
            photos.forEach((photoUrl, index) => {
                const photoItem = document.createElement('div');
                photoItem.classList.add('photo-item');
                photoItem.innerHTML = `
                    <img src="${photoUrl}" alt="Photo ${index + 1}">
                    <div class="photo-overlay">
                        <span>💕</span>
                    </div>
                `;
                photoGallery.appendChild(photoItem);
            });
        }

        // ===== SET LETTER TEXT =====
        function setLetterText() {
            letterText.textContent = message;
        }

        // ===== MESSAGE CARD CLICK =====
        messageCard.addEventListener('click', function() {
            messageCard.style.display = 'none';
            letterSection.classList.add('show');
            photoSection.classList.add('show');
            backBtn.classList.add('show');
        });

        // ===== BACK BUTTON =====
        backBtn.addEventListener('click', function() {
            letterSection.classList.remove('show');
            photoSection.classList.remove('show');
            messageCard.style.display = 'block';
            backBtn.classList.remove('show');
            bgMusic.currentTime = 0;
        });

        // ===== MUSIC PLAYER =====
        let isPlaying = false;
        musicBtn.addEventListener('click', function() {
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                bgMusic.play();
                musicBtn.classList.add('playing');
                isPlaying = true;
            }
        });

        bgMusic.addEventListener('ended', function() {
            bgMusic.currentTime = 0;
            bgMusic.play();
        });

        // ===== INITIALIZE =====
        createFloatingHearts();
        loadPhotos();
        setLetterText();
    </script>
</body>
</html>
